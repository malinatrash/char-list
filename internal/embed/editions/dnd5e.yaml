traits:
    - Я всегда ищу повод для доброй драки.
    - Я обожаю рассказывать истории о своих подвигах, приукрашивая их.
    - Ничто не выведет меня из равновесия.
    - Я говорю мало, но слушаю внимательно.
    - Я сыплю цитатами из древних текстов, часто невпопад.
    - Я сужу о людях по тому, как они обращаются со своим оружием.
    - Я не могу удержаться, чтобы не взять что-нибудь блестящее.
    - Мне неловко в обществе знати.
    - Я легко завожу друзей, где бы ни оказался.
    - Я всегда ем так, словно это мой последний ужин.
    - Я предпочитаю решать всё по-своему и ненавижу приказы.
    - Я собираю слухи, как другие собирают монеты.
