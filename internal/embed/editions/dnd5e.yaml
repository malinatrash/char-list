bonds:
    - Я отдам жизнь за своих товарищей по оружию.
    - Меня ждёт долг, который я должен выплатить.
    - Я ищу того, кто разрушил мою семью.
    - Мой учитель погиб, и я должен завершить его дело.
    - Где-то есть артефакт, который принадлежит мне по праву.
    - Я защищаю родную деревню, даже когда далеко от неё.
    - Моя честь — это моя жизнь.
    - Я должен доказать, что достоин своего имени.
