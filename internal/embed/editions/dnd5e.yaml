alignments:
    - name: Законно-добрый
      desc: "Делает добро по правилам: рыцарь, судья, честный страж."
    - name: Нейтрально-добрый
      desc: Помогает людям, не оглядываясь на законы и традиции.
    - name: Хаотично-добрый
      desc: Добрый бунтарь, слушает сердце, а не закон.
    - name: Законно-нейтральный
      desc: "Порядок и долг выше добра и зла: солдат, чиновник."
    - name: Нейтральный
      desc: Без крайностей, живёт своей жизнью и не лезет в чужие.
    - name: Хаотично-нейтральный
      desc: Свобода превыше всего, непредсказуем и своеволен.
    - name: Законно-злой
      desc: "Жестокий, но держит слово и чтит иерархию: тиран, дьявол."
    - name: Нейтрально-злой
      desc: Делает что выгодно, без угрызений совести.
    - name: Хаотично-злой
      desc: Разрушает ради разрушения, никому не верен.
backgrounds:
    - name: Аколит
      desc: Служил в храме и знает обряды.
      details: Проницательность и Религия; в храмах своей веры примут и помогут.
      skills:
        - insight
        - religion
      extra: Два любых языка
      equipment:
        - Священный символ
        - Молитвенник
        - 5 палочек благовоний
        - Одежда
        - 15 зм
      feature: Приют верующих
    - name: Преступник
      desc: Жил вне закона и знает тёмную сторону города.
      details: Обман и Скрытность; есть связи в преступном мире.
      skills:
        - deception
        - stealth
      extra: Воровские инструменты, игровой набор
      equipment:
        - Ломик
        - Тёмная одежда с капюшоном
        - 15 зм
      feature: Преступные связи
    - name: Народный герой
      desc: Простолюдин, прославившийся добрым делом.
      details: Уход за животными и Выживание; простые люди дадут кров и еду.
      skills:
        - animal
        - survival
      extra: Ремесленные инструменты, наземные средства передвижения
      equipment:
        - Ремесленные инструменты
        - Лопата
        - Железный горшок
        - Одежда
        - 10 зм
      feature: Деревенское гостеприимство
    - name: Благородный
      desc: Из знатной семьи, привык к власти и этикету.
      details: История и Убеждение; знать принимает как своего.
      skills:
        - history
        - persuasion
      extra: Игровой набор, один язык
      equipment:
        - Дорогая одежда
        - Перстень с печатью
        - Свиток родословной
        - 25 зм
      feature: Положение в обществе
    - name: Мудрец
      desc: Учёный, провёл годы за книгами.
      details: Магия и История; знает, где и у кого искать любые знания.
      skills:
        - arcana
        - history
      extra: Два любых языка
      equipment:
        - Бутылочка чернил
        - Перо
        - Нож
        - Письмо от коллеги
        - Одежда
        - 10 зм
      feature: Исследователь
    - name: Солдат
      desc: Служил в армии, знает строй и приказы.
      details: Атлетика и Запугивание; бывшие сослуживцы признают звание.
      skills:
        - athletics
        - intimidation
      extra: Игровой набор, наземные средства передвижения
      equipment:
        - Знак отличия
        - Трофей с поверженного врага
        - Кости
        - Одежда
        - 10 зм
      feature: Военное звание
    - name: Отшельник
      desc: Жил в уединении и что-то открыл.
      details: Медицина и Религия; хранит тайное открытие, важное для сюжета.
      skills:
        - medicine
        - religion
      extra: Набор травника, один язык
      equipment:
        - Футляр для свитков
        - Одеяло
        - Одежда
        - Набор травника
        - 5 зм
      feature: Открытие
    - name: Артист
      desc: Выступал перед публикой, любит внимание.
      details: Акробатика и Выступление; за выступление дадут ночлег и еду.
      skills:
        - acrobatics
        - performance
      extra: Набор для грима, музыкальный инструмент
      equipment:
        - Музыкальный инструмент
        - Подарок поклонника
        - Костюм
        - 15 зм
      feature: Популярность
    - name: Чужеземец
      desc: Вырос в дикой глуши, далеко от городов.
      details: Атлетика и Выживание; помнит дороги и находит еду для отряда.
      skills:
        - athletics
        - survival
      extra: Музыкальный инструмент, один язык
      equipment:
        - Посох
        - Капкан
        - Трофей с убитого животного
        - Одежда путешественника
        - 10 зм
      feature: Странник
    - name: Гильдейский ремесленник
      desc: Мастер своего дела из гильдии.
      details: Проницательность и Убеждение; гильдия поддержит и приютит.
      skills:
        - insight
        - persuasion
      extra: Ремесленные инструменты, один язык
      equipment:
        - Ремесленные инструменты
        - Рекомендательное письмо гильдии
        - Одежда путешественника
        - 15 зм
      feature: Членство в гильдии
    - name: Моряк
      desc: Ходил по морям, знает порты и корабли.
      details: Атлетика и Внимательность; бесплатный проезд на корабле за работу.
      skills:
        - athletics
        - perception
      extra: Навигационные инструменты, водные средства передвижения
      equipment:
        - Дубинка
        - 50 футов шёлковой верёвки
        - Талисман
        - Одежда
        - 10 зм
      feature: Проезд на корабле
    - name: Шарлатан
      desc: Мошенник с чужими именами и ловкими руками.
      details: Обман и Ловкость рук; есть готовая фальшивая личность.
      skills:
        - deception
        - sleight
      extra: Набор для грима, набор для фальсификации
      equipment:
        - Дорогая одежда
        - Набор для грима
        - Инструменты мошенника
        - 15 зм
      feature: Фальшивая личность
    - name: Беспризорник
      desc: Вырос на улицах и выжил.
      details: Ловкость рук и Скрытность; знает тайные ходы города.
      skills:
        - sleight
        - stealth
      extra: Набор для грима, воровские инструменты
      equipment:
        - Небольшой нож
        - Карта родного города
        - Ручная мышь
        - Памятная вещь родителей
        - Одежда
        - 10 зм
      feature: Городские тайны
bonds:
    - Я отдам жизнь за своих товарищей по оружию.
    - Меня ждёт долг, который я должен выплатить.
    - Я ищу того, кто разрушил мою семью.
    - Мой учитель погиб, и я должен завершить его дело.
    - Где-то есть артефакт, который принадлежит мне по праву.
    - Я защищаю родную деревню, даже когда далеко от неё.
    - Моя честь — это моя жизнь.
    - Я должен доказать, что достоин своего имени.
