flaws:
    - Я не доверяю никому, кроме себя.
    - Выпивка и азарт тянут меня на дно.
    - Я не могу устоять перед красивым лицом.
    - Я слишком уверен в себе и часто лезу на рожон.
    - Тайна, которую я храню, однажды погубит меня.
    - Я презираю трусов и часто говорю об этом вслух.
    - Я никогда не признаю своих ошибок.
    - Ради золота я готов на многое.
ideals:
    - Свобода. Цепи предназначены для того, чтобы их разбивать. (Хаотичный)
    - Традиция. Древние обычаи нужно хранить. (Законный)
    - Милосердие. Я помогаю тем, кто не может помочь себе. (Добрый)
    - Власть. Однажды я буду править. (Злой)
    - Знание. Путь к силе лежит через понимание. (Нейтральный)
    - Честь. Я никогда не нарушу данного слова. (Законный)
    - Перемены. Мы должны помогать переменам, что несёт судьба. (Хаотичный)
    - Величие. Меня будут помнить. (Любой)
    - Народ. Я защищаю тех, с кем живу. (Нейтральный)
