deities:
    - name: Святой Террагнис (законный)
      desc: Рыцарь-святой, покровитель воинов и защитников.
    - name: Мадира Завет (законная)
      desc: Богиня договоров, закона и клятв.
    - name: Гед (нейтральный)
      desc: Бог земли, ремёсел и простого труда.
    - name: Орд (нейтральный)
      desc: Бог магии, знаний и тайн.
    - name: Потерянные (нейтральные)
      desc: Забытые духи, которым молятся вне храмов.
    - name: Мемнон (хаотичный)
      desc: Бог огня и разрушения, брат Террагниса.
    - name: Шун Мерзкая (хаотичная)
      desc: Богиня тьмы, хитрости и чёрной магии.
    - name: Рамлаат (хаотичный)
      desc: Бог войны, ярости и грубой силы.
