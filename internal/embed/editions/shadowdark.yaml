abilityDesc:
    str: Сила. Ближний бой, тяжёлые двери, слоты снаряжения.
    dex: Ловкость. Стрельба, уклонение, защита, воровские дела.
    con: Телосложение. Прибавка к хитам, выносливость.
    int: Интеллект. Магия волшебника, знания, языки.
    wis: Мудрость. Магия жреца, внимательность, чутьё.
    cha: Харизма. Переговоры, лидерство, сделки с духами.
