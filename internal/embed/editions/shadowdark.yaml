backgrounds:
    - name: Беспризорник
      desc: Рос на улице, знает трущобы и как выжить без гроша.
    - name: В розыске
      desc: За голову назначена награда, лучше не светиться.
    - name: Посвящённый культа
      desc: Состоял в тайном культе и знает его обряды.
    - name: Гильдия воров
      desc: Член гильдии воров, есть связи и долги.
    - name: Изгнанник
      desc: Выгнан из родных мест, назад дороги нет.
    - name: Сирота
      desc: Вырос без семьи, надеется только на себя.
    - name: Ученик волшебника
      desc: Прислуживал магу и нахватался основ магии.
    - name: Ювелир
      desc: Разбирается в камнях и драгоценностях, знает им цену.
    - name: Травник
      desc: Собирает травы, умеет лечить и травить.
    - name: Варвар
      desc: Из диких племён, силён и чужд городским порядкам.
    - name: Наёмник
      desc: Воевал за деньги, знает оружие и цену жизни.
    - name: Моряк
      desc: Ходил по морям, умеет управляться с верёвками и кораблём.
    - name: Послушник
      desc: Служил в храме, знает молитвы и обряды.
    - name: Солдат
      desc: Служил в войске, привык к строю и приказам.
    - name: Следопыт
      desc: Жил в лесах, читает следы и находит дорогу.
    - name: Разведчик
      desc: Ходил в тыл врага, умеет прятаться и наблюдать.
    - name: Менестрель
      desc: Пел и играл по тавернам, знает людей и слухи.
    - name: Учёный
      desc: Провёл годы за книгами, знает историю и языки.
    - name: Дворянин
      desc: Из знатного рода, привык к этикету и власти.
    - name: Хирург
      desc: Лечил раны, знает тело и как его чинить.
