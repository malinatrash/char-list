alignments:
    - name: Законный
      desc: Порядок, честь и слово. Служит закону и богам порядка.
    - name: Нейтральный
      desc: Своя выгода и равновесие, без крайностей.
    - name: Хаотичный
      desc: Свобода и своеволие, законы для других.
